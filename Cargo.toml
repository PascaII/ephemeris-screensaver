[workspace]
members = [".", "tools/assetgen"]
default-members = ["."]
resolver = "2"

[package]
name = "ephemeris"
version = "0.1.0"
edition = "2021"
description = "Minimal live day/night world map screensaver with geolocated news"
license = "MIT"
publish = false

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "wgl", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "wgl", "x11", "wayland"] }
glow = "0.16"
raw-window-handle = "0.6"
png = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
quick-xml = "0.37"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
fontdue = { version = "0.9", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep asset decoding fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
